<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: CanvasText;
      background: Canvas;
      color-scheme: light dark;
      max-width: 480px;
      margin: 20px auto;
      padding: 0 16px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: CanvasText;
    }

    /* Service section */
    .service-section {
      margin-bottom: 4px;
    }

    .service-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: CanvasText;
      padding: 8px 0 6px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      user-select: none;
    }

    .service-header input[type="radio"] {
      margin: 0;
      cursor: pointer;
      accent-color: #0060df;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .service-config {
      padding: 12px 0 4px 23px;
    }

    .privacy-note {
      margin: 4px 0 8px;
      font-size: 13px;
      color: #856404;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 8px 10px;
    }

    /* Fields */
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 13px;
    }

    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      color: FieldText;
      background: Field;
    }

    textarea {
      font-family: "Cascadia Code", "Fira Mono", "Consolas", monospace;
      font-size: 12px;
      resize: vertical;
    }

    .field {
      margin-bottom: 16px;
    }

    .field-hint {
      margin-top: 4px;
      font-size: 12px;
      color: GrayText;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input,
    .input-row select { flex: 1; }

    /* Preferences section */
    .prefs-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e0e0e0;
    }

    .prefs-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin: 0 0 14px;
    }

    .checkbox-field label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
    }

    .checkbox-field input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
      accent-color: #0060df;
      flex-shrink: 0;
    }

    /* Buttons */
    button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      color: ButtonText;
      background: ButtonFace;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover { filter: brightness(0.95); }

    button.primary {
      background: #0060df;
      color: #fff;
      border-color: #0060df;
    }

    button.primary:hover { background: #004ebc; filter: none; }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    /* Status */
    .status {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    /* Collapsible advanced section */
    details.advanced-section {
      margin-top: 8px;
      margin-bottom: 8px;
    }

    details.advanced-section summary {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      list-style: disclosure-closed;
    }

    details.advanced-section[open] summary {
      list-style: disclosure-open;
      margin-bottom: 12px;
    }

    details.advanced-section summary:hover {
      color: #0060df;
    }

    .advanced-content {
      padding-left: 4px;
      border-left: 2px solid #e0e0e0;
      padding-left: 12px;
    }
  </style>
</head>
<body>
  <h2 data-i18n="appName"></h2>

  <!-- Tencent TokenHub translation -->
  <div class="service-section">
    <label class="service-header">
      <input type="radio" name="service" value="tencent" id="radio-tencent">
      Tencent TokenHub (Hy-MT2)
    </label>
    <div class="service-config">
      <p class="privacy-note" data-i18n="tencentPrivacyNote"></p>
      <div class="field">
        <label for="tencentApiKey">TokenHub API Key</label>
        <input type="password" id="tencentApiKey" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="tencentModel">Model</label>
        <select id="tencentModel">
          <option value="hy-mt2-lite">Hy-MT2-Lite — fastest</option>
          <option value="hy-mt2-plus">Hy-MT2-Plus — balanced</option>
          <option value="hy-mt2-pro">Hy-MT2-Pro — professional</option>
        </select>
      </div>
      <div class="input-row">
        <button id="testTencentConnection" data-i18n="testConnection"></button>
      </div>
      <div id="tencentTestStatus" class="status"></div>
      <p class="field-hint" data-i18n="tokenHubKeyHint"></p>
      <p id="tencentUsage" class="field-hint"></p>
      <p id="lastTranslationPerformance" class="field-hint"></p>
    </div>
  </div>

  <div class="button-row">
    <button id="save" class="primary" data-i18n="save"></button>
  </div>

  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
